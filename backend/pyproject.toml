[project]
name = "groundtruth"
version = "0.1.0"
description = "A self-evaluating, version-aware RAG platform over the Kubernetes documentation."
requires-python = ">=3.11,<3.14"

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Database ---
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    # --- Config / CLI / logging ---
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    # --- LLM ---
    "anthropic>=1.0",
    # --- ML: embeddings + cross-encoder reranking (local, CPU) ---
    "sentence-transformers>=3.3",
    "torch>=2.5",
    # --- Ingestion ---
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "markdown-it-py>=3.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

# --- uv -------------------------------------------------------------------
# Pull torch from the CPU-only index. The default PyPI wheels bundle CUDA
# (~2.5GB) which we never use: embeddings and reranking run on CPU here.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- ruff -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",
    "BLE",  # broad excepts must be justified with a noqa explaining why
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# Non-strict by design (PROJECT_SPEC.md S4): we want type hints everywhere,
# not a fight with third-party stubs.
strict = false

[[tool.mypy.overrides]]
module = ["evals.*"]
disallow_untyped_defs = false

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres (deselect with '-m \"not integration\"')",
    "slow: downloads models or hits the network",
]
filterwarnings = ["ignore::DeprecationWarning"]
