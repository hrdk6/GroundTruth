# Retrieval regression gate for CI.
#
# These are floors, not targets. A PR fails when a tracked metric drops below
# its floor on the fixture golden set, which catches "I refactored the chunker
# and quietly lost 8% recall" before it merges.
#
# How to set them: run the fixture eval on main, then set each floor a little
# below the observed value -- enough slack to absorb noise, tight enough to
# catch a real regression. Raising a floor after a genuine improvement is the
# normal way this file changes, and doing so is part of the PR that improved it.
#
# LOWERING a floor is only legitimate alongside a recorded experiment in
# EXPERIMENTS.md explaining the trade that was accepted. Lowering it to make a
# red build green is how a regression gate becomes decoration.

dataset: fixture_golden.jsonl
config: configs/baseline.yaml
split: all
mode: retrieval

# Measured on 2026-09-23 with configs/hybrid.yaml over the fixture corpus:
#   recall@5 0.8333 · recall@10 0.8333 · MRR 0.8333 · nDCG@10 0.8333
# Floors sit ~0.08 below the observed values. With only 8 fixture items one
# item is worth 0.125, so this tolerates nothing silently but will not fail on
# a tie-break reordering.
metrics:
  recall@5: 0.75
  recall@10: 0.75
  mrr: 0.70
  ndcg@10: 0.70

# Per-category floors catch a change that lifts the average while destroying
# one category -- exactly what a chunker change can do to table_or_code.
# Observed: exact_term 1.000 (n=2), table_or_code 1.000 (n=1), factual 0.667 (n=3).
# The fixture set has no version_sensitive item, so no floor is set for it --
# a floor on a category with no items would pass vacuously.
by_category:
  exact_term:
    recall@5: 1.0
  table_or_code:
    recall@5: 1.0
  factual:
    recall@5: 0.60
