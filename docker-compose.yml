# GroundTruth local stack: `make up`. For a server, see docker-compose.prod.yml.
#
# Postgres, the API, and the UI on localhost:3000. The backend and frontend
# mount their source and reload on edits, so a change on the host needs no
# rebuild. `docker compose up -d db backend` starts the API alone.
#
# Migrations are not run by the backend here (its command skips the image's
# migrate step); `make up` runs them inside the container, against this
# database -- not the host's .env, which may point at `make db-local`.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: groundtruth-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundtruth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
      POSTGRES_DB: ${POSTGRES_DB:-groundtruth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, which
      # lets migrations race the first boot. Check the database by name.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundtruth} -d ${POSTGRES_DB:-groundtruth}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      # The repo root: the image copies configs/ and experiments/ from beside
      # backend/, and lays them out under /srv as they are laid out here.
      context: .
      dockerfile: backend/Dockerfile
    container_name: groundtruth-backend
    # The image runs as an unprivileged user; the bind mounts below belong to
    # the host's user, and ingestion and evals write into data/ and
    # experiments/. Development only -- docker-compose.prod.yml mounts no source.
    user: root
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-groundtruth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
      POSTGRES_DB: ${POSTGRES_DB:-groundtruth}
      # The provider every published result used is an OpenAI-compatible free
      # tier, so it has to be reachable from the container too -- not only
      # Anthropic. Values come from the host's .env via Compose interpolation.
      GT_LLM_PROVIDER: ${GT_LLM_PROVIDER:-anthropic}
      GT_LLM_BASE_URL: ${GT_LLM_BASE_URL:-}
      GT_LLM_API_KEY: ${GT_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GT_GENERATION_MODEL: ${GT_GENERATION_MODEL:-claude-sonnet-5}
      GT_CHEAP_MODEL: ${GT_CHEAP_MODEL:-claude-haiku-4-5}
      GT_LOG_LEVEL: ${GT_LOG_LEVEL:-INFO}
      GT_LOG_FORMAT: ${GT_LOG_FORMAT:-console}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv/backend
      - ./configs:/srv/configs:ro
      - ./data:/srv/data
      - ./experiments:/srv/experiments
      # The image's model cache (bge-small, baked in) seeds this volume, which
      # then keeps any model a config adds -- the reranker -- across restarts.
      - hf_models:/opt/hf
      # The LLM cache's default location, `.cache/llm` under the repo root.
      - llm_cache:/srv/.cache
    # `make up` migrates after the API is up, so this skips the image's migrate step.
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The dev server over the mounted source; the image's final stage is
      # the production server (docker-compose.prod.yml).
      target: dev
    container_name: groundtruth-frontend
    depends_on:
      - backend
    environment:
      # Read by the Next.js dev server's proxy, which runs *inside* this
      # container: `localhost` here is the frontend itself, not the API.
      NEXT_PUBLIC_API_URL: http://backend:8000
      # File events do not cross a Windows or macOS bind mount into the Linux
      # VM, so without polling an edit on the host never reloads the page.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  hf_models:
  llm_cache:
