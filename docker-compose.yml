# GroundTruth local stack: `make up`.
#
# The backend mounts the source read-write and runs uvicorn --reload, so edits
# on the host take effect without a rebuild. The frontend is behind the
# `frontend` profile (`docker compose --profile frontend up`) so `make up`
# stays fast for backend-only work.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: groundtruth-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundtruth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
      POSTGRES_DB: ${POSTGRES_DB:-groundtruth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, which
      # lets migrations race the first boot. Check the database by name.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundtruth} -d ${POSTGRES_DB:-groundtruth}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groundtruth-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-groundtruth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundtruth}
      POSTGRES_DB: ${POSTGRES_DB:-groundtruth}
      # The provider every published result used is an OpenAI-compatible free
      # tier, so it has to be reachable from the container too -- not only
      # Anthropic. Values come from the host's .env via Compose interpolation.
      GT_LLM_PROVIDER: ${GT_LLM_PROVIDER:-anthropic}
      GT_LLM_BASE_URL: ${GT_LLM_BASE_URL:-}
      GT_LLM_API_KEY: ${GT_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GT_GENERATION_MODEL: ${GT_GENERATION_MODEL:-claude-sonnet-5}
      GT_CHEAP_MODEL: ${GT_CHEAP_MODEL:-claude-haiku-4-5}
      GT_LOG_LEVEL: ${GT_LOG_LEVEL:-INFO}
      GT_LOG_FORMAT: ${GT_LOG_FORMAT:-console}
      # Absolute, because inside the image the repo root resolves to `/`, and
      # a relative cache dir would land outside the named volume below.
      GT_LLM_CACHE_DIR: /cache/llm
      # Keep the HuggingFace model cache on a named volume: re-downloading
      # bge-small on every container start is slow and pointless.
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./configs:/configs:ro
      - ./data:/data
      - ./experiments:/experiments
      - hf_models:/models
      - llm_cache:/cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: groundtruth-frontend
    depends_on:
      - backend
    environment:
      # Read by the Next.js dev server's proxy, which runs *inside* this
      # container: `localhost` here is the frontend itself, not the API.
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  hf_models:
  llm_cache:
