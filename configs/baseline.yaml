# The naive RAG baseline: fixed-size chunks, dense-only retrieval, no reranking.
#
# This config exists to be beaten. Every improvement in Phase 3 is measured as a
# delta against the numbers this produces, so it deliberately makes the obvious
# first-pass choices rather than good ones.
name: baseline
description: >
  Fixed 512-token chunks with 64-token overlap, embedded with bge-small, dense
  cosine retrieval only, top-5 into a grounded-answer prompt. No lexical search,
  no fusion, no reranking, no query rewriting, no verification.

chunking:
  chunker: fixed
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 32

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

retrieval:
  dense:
    enabled: true
    k: 20
  lexical:
    enabled: false
  fusion:
    enabled: false
  rerank:
    enabled: false
  query_rewrite:
    enabled: false
  decomposition:
    enabled: false
  k_final: 5
  version_filter: true

generation:
  prompt: grounded_v1
  max_tokens: 1024
  temperature: 0.0

verification:
  enabled: false

versioning:
  default_version: latest
  detect_from_question: true
  conflict_detection: false
