# The shipping configuration.
#
# Retrieval is `hybrid_bm25`: structure-aware chunks, dense + any-term lexical
# ranked by BM25, fused with RRF.
#
# Read this before trusting that choice: after the measurement audit, NO
# retrieval variant is distinguishable from noise on golden_v1 (14 dev / 10
# test scored items) -- the corrected dense-only baseline is as good as
# anything. hybrid_bm25 is chosen on the evidence that does separate: any-term
# lexical needs IDF (hybrid, which lacks it, lost the fixture's table_or_code
# item and scored lowest on test), and structure-aware chunks keep YAML and
# tables whole in the context the model reads -- a generation-side benefit
# retrieval recall does not measure. Both are hypotheses a larger golden set
# should test. EXPERIMENTS.md has the paired comparisons.
#
# **Reranking is deliberately OFF**: hybrid_rerank was within noise of hybrid
# on both splits while multiplying retrieval latency ~100x (p50 ~8s on CPU).
#
# On top of that retrieval, this adds the Phase 4 generation work: claim
# verification with regenerate-or-abstain, cross-version conflict notes, and
# multi-hop decomposition.
name: full
description: >
  The shipping pipeline: structure-aware chunking, dense + BM25 lexical
  retrieval fused with RRF, query rewriting, multi-hop decomposition, grounded
  generation with per-sentence claim verification, and version conflict notes.
  No reranking -- it was measured and did not earn its latency.

chunking:
  chunker: structure_aware
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 64
  prepend_heading_path: true

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

retrieval:
  dense: {enabled: true, k: 20}
  lexical: {enabled: true, k: 20, text_search_config: english, match: any, ranking: bm25}
  fusion: {enabled: true, rrf_k: 60}
  # Measured harmful in the hybrid_rerank experiment; see EXPERIMENTS.md.
  rerank: {enabled: false}
  query_rewrite: {enabled: true, keep_original_for_lexical: true}
  decomposition: {enabled: true, max_subqueries: 3}
  k_final: 6
  version_filter: true

generation:
  prompt: grounded_v1
  max_tokens: 1024

verification:
  enabled: true
  support_threshold: 0.8
  max_regenerations: 1

versioning:
  default_version: latest
  detect_from_question: true
  conflict_detection: true
