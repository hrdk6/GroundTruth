# The shipping configuration.
#
# Retrieval is `hybrid`. **Reranking is deliberately OFF**: the hybrid_rerank
# experiment found no difference distinguishable from noise on either split
# while multiplying retrieval latency by two orders of magnitude, so it did not
# earn its place. See EXPERIMENTS.md for the paired comparison. Keeping it on
# "because the spec lists it" would contradict the evidence this project exists
# to produce.
#
# On top of that retrieval, this adds the Phase 4 generation work: claim
# verification with regenerate-or-abstain, cross-version conflict notes, and
# multi-hop decomposition.
name: full
description: >
  The shipping pipeline: structure-aware chunking, hybrid dense + lexical
  retrieval fused with RRF, query rewriting, multi-hop decomposition, grounded
  generation with per-sentence claim verification, and version conflict notes.
  No reranking -- it was measured and reverted.

chunking:
  chunker: structure_aware
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 64
  prepend_heading_path: true

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

retrieval:
  dense: {enabled: true, k: 20}
  lexical: {enabled: true, k: 20, text_search_config: english, match: any}
  fusion: {enabled: true, rrf_k: 60}
  # Measured harmful in the hybrid_rerank experiment; see EXPERIMENTS.md.
  rerank: {enabled: false}
  query_rewrite: {enabled: true, keep_original_for_lexical: true}
  decomposition: {enabled: true, max_subqueries: 3}
  k_final: 6
  version_filter: true

generation:
  prompt: grounded_v1
  max_tokens: 1024

verification:
  enabled: true
  support_threshold: 0.8
  max_regenerations: 1

versioning:
  default_version: latest
  detect_from_question: true
  conflict_detection: true
