# Experiment 1: change the chunker, nothing else.
#
# Against: baseline. The single variable is fixed -> structure_aware.
# Hypothesis: the baseline cuts YAML examples and tables in half, so chunks
# that should answer table_or_code questions are unretrievable as a unit.
# Expect the largest gain in `table_or_code` and `exact_term`.
name: structure_aware
description: >
  Baseline with heading-aware chunking that never splits a fenced code block or
  a table, merges tiny sections, and prepends the heading path to the embedded
  text. Dense-only retrieval, as in the baseline.

chunking:
  chunker: structure_aware
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 64
  prepend_heading_path: true

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

retrieval:
  dense: {enabled: true, k: 20}
  lexical: {enabled: false}
  fusion: {enabled: false}
  rerank: {enabled: false}
  query_rewrite: {enabled: false}
  decomposition: {enabled: false}
  k_final: 5
  version_filter: true

generation:
  prompt: grounded_v1
  max_tokens: 1024

verification:
  enabled: false

versioning:
  default_version: latest
  detect_from_question: true
  conflict_detection: false
