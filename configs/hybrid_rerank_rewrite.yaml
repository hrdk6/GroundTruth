# Experiment 4: add cheap-model query rewriting.
#
# Against: hybrid_rerank. The single variable is the rewrite stage.
# Hypothesis: expanding abbreviations ("HPA" -> "HorizontalPodAutoscaler") and
# adding likely exact terms helps both legs, and helps lexical search most.
#
# The original query is kept for the lexical leg on purpose: a rewrite can drop
# the exact token the user typed, and that token is often the only thing
# lexical search had to work with.
#
# This is the first config that costs money per query and adds a round-trip of
# latency before retrieval even starts. It has to earn that.
name: hybrid_rerank_rewrite
description: >
  hybrid_rerank plus a Haiku query rewrite, keeping the original query in the
  lexical leg.

chunking:
  chunker: structure_aware
  max_tokens: 512
  overlap_tokens: 64
  min_tokens: 64
  prepend_heading_path: true

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

retrieval:
  dense: {enabled: true, k: 20}
  lexical: {enabled: true, k: 20, text_search_config: english}
  fusion: {enabled: true, rrf_k: 60}
  rerank: {enabled: true, model: BAAI/bge-reranker-base, batch_size: 32}
  query_rewrite: {enabled: true, keep_original_for_lexical: true}
  decomposition: {enabled: false}
  k_final: 5
  version_filter: true

generation:
  prompt: grounded_v1
  max_tokens: 1024

verification:
  enabled: false

versioning:
  default_version: latest
  detect_from_question: true
  conflict_detection: false
