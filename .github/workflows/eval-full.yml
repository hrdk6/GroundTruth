name: Full evaluation (manual)

# Generation evals call a model, so they never run automatically. With the
# free-tier provider they cost $0 but take a while; with Anthropic they cost
# money -- check the estimate in EXPERIMENTS.md first.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Config to evaluate
        default: configs/full.yaml
        required: true
      split:
        description: Dataset split
        default: dev
        required: true
        type: choice
        options: [dev, test]

jobs:
  evaluate:
    name: Generation eval
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth
          POSTGRES_DB: groundtruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth -d groundtruth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: groundtruth
      POSTGRES_DB: groundtruth
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # Either provider works. Set GT_LLM_PROVIDER=openai plus GT_LLM_* for an
      # OpenAI-compatible endpoint (what every published result used), or
      # leave it unset and provide ANTHROPIC_API_KEY.
      GT_LLM_PROVIDER: ${{ vars.GT_LLM_PROVIDER || 'anthropic' }}
      GT_LLM_BASE_URL: ${{ vars.GT_LLM_BASE_URL }}
      GT_GENERATION_MODEL: ${{ vars.GT_GENERATION_MODEL || 'claude-sonnet-5' }}
      GT_CHEAP_MODEL: ${{ vars.GT_CHEAP_MODEL || 'claude-haiku-4-5' }}
      GT_LLM_API_KEY: ${{ secrets.GT_LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Migrate
        working-directory: backend
        run: uv run python -m alembic upgrade head

      # The same subset golden_v1 was written against. The full corpus would
      # take hours to embed on a runner and measure pages no item asks about.
      - name: Ingest the evaluated corpus
        working-directory: backend
        run: >-
          uv run python -m app.ingestion.run
          --config ../${{ inputs.config }}
          --versions 1.26 1.30
          --include concepts tasks

      - name: Run the full evaluation
        working-directory: backend
        run: >-
          uv run python -m evals.runner
          --config ../${{ inputs.config }}
          --split ${{ inputs.split }}
          --mode full

      # The experiment file is the only record a reported number may come from,
      # so it is kept as an artifact rather than left in a log.
      - name: Upload the experiment record
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ inputs.split }}
          path: experiments/*.json
          if-no-files-found: error
