name: Full evaluation (manual)

# Generation evals cost money, so they never run automatically.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Config to evaluate
        default: configs/baseline.yaml
        required: true
      split:
        description: Dataset split
        default: dev
        required: true
        type: choice
        options: [dev, test]

jobs:
  evaluate:
    name: Generation eval
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth
          POSTGRES_DB: groundtruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth -d groundtruth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: groundtruth
      POSTGRES_DB: groundtruth
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Migrate
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Ingest the corpus
        working-directory: backend
        run: uv run python -m app.ingestion.run --config ../${{ inputs.config }}

      - name: Run the full evaluation
        working-directory: backend
        run: |
          uv run python -m evals.runner             --config ../${{ inputs.config }}             --split ${{ inputs.split }}             --mode full

      # The experiment file is the only record a reported number may come from,
      # so it is kept as an artifact rather than left in a log.
      - name: Upload the experiment record
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ inputs.config }}-${{ inputs.split }}
          path: experiments/*.json
          if-no-files-found: error
